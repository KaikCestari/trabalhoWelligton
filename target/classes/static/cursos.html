<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos | Cadastro de Cursos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div>
            <span class="section-label">Sistema academico</span>
            <h1>Cadastro de Cursos</h1>
        </div>
        <button id="logoutButton" class="ghost-button" type="button">Sair</button>
    </header>

    <main class="dashboard">
        <section class="editor-panel">
            <h2 id="formTitle">Novo curso</h2>
            <form id="cursoForm" class="course-form">
                <input type="hidden" id="cursoId">
                <label>
                    Nome do curso
                    <input type="text" id="nome" required>
                </label>
                <label>
                    Categoria
                    <input type="text" id="categoria" required>
                </label>
                <label>
                    Carga horaria
                    <input type="number" id="cargaHoraria" min="1" required>
                </label>
                <label>
                    Professor
                    <input type="text" id="professor" required>
                </label>
                <label class="check-row">
                    <input type="checkbox" id="ativo" checked>
                    Curso ativo
                </label>
                <div class="form-actions">
                    <button type="submit">Salvar curso</button>
                    <button id="cancelarButton" class="ghost-button" type="button">Limpar</button>
                </div>
                <p id="formMensagem" class="message"></p>
            </form>
        </section>

        <section class="list-panel">
            <div class="list-header">
                <div>
                    <span class="section-label">Cursos cadastrados</span>
                    <h2>Lista de cursos</h2>
                </div>
                <span id="totalCursos" class="count-pill">0</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Curso</th>
                            <th>Categoria</th>
                            <th>Carga</th>
                            <th>Professor</th>
                            <th>Status</th>
                            <th>Acoes</th>
                        </tr>
                    </thead>
                    <tbody id="cursosTabela"></tbody>
                </table>
            </div>
            <p id="listaVazia" class="empty-state">Nenhum curso cadastrado.</p>
        </section>
    </main>
    <script src="cursos.js"></script>
</body>
</html>
